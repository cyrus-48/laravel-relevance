<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#020617" />
        </linearGradient>

        <!-- Laravel Red Glow -->
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FF2D20" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#FF2D20" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#glow)"/>

    <!-- Subtle Tech Grid -->
    <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
        <path d="M0,105 L1200,105 M0,210 L1200,210 M0,315 L1200,315 M0,420 L1200,420 M0,525 L1200,525" />
        <path d="M200,0 L200,630 M400,0 L400,630 M600,0 L600,630 M800,0 L800,630 M1000,0 L1000,630" />
    </g>

    <!-- Icon Group -->
    <g transform="translate(500, 150)">
        <!-- Outer search ring -->
        <circle cx="100" cy="100" r="70" fill="none" stroke="#FF2D20" stroke-width="12" stroke-linecap="round"/>
        <!-- Search handle -->
        <line x1="150" y1="150" x2="220" y2="220" stroke="#FF2D20" stroke-width="16" stroke-linecap="round"/>

        <!-- Recommendation nodes inside the glass -->
        <circle cx="70" cy="80" r="8" fill="#e2e8f0"/>
        <circle cx="110" cy="70" r="10" fill="#f8fafc"/>
        <circle cx="90" cy="120" r="12" fill="#cbd5e1"/>
        <circle cx="130" cy="110" r="6" fill="#e2e8f0"/>

        <!-- Connecting ML lines -->
        <line x1="70" y1="80" x2="110" y2="70" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.6"/>
        <line x1="70" y1="80" x2="90" y2="120" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.6"/>
        <line x1="110" y1="70" x2="90" y2="120" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.6"/>
        <line x1="110" y1="70" x2="130" y2="110" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.6"/>
        <line x1="90" y1="120" x2="130" y2="110" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.6"/>
    </g>

    <!-- Title -->
    <text x="600" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        Laravel Relevance
    </text>

    <!-- Subtitle -->
    <text x="600" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="4" text-transform="uppercase">
        A Multipurpose Search &amp; Recommendation Toolkit
    </text>
</svg>
